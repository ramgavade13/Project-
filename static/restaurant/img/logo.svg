<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="lemonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE166" />
      <stop offset="100%" stop-color="#F4CE14" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7E74" />
      <stop offset="100%" stop-color="#495E57" />
    </linearGradient>
  </defs>

  <!-- Lemon Fruit Icon -->
  <g transform="translate(10, 8)">
    <!-- Leaf -->
    <path d="M30 18 C30 8, 44 4, 48 4 C48 14, 38 22, 30 18 Z" fill="url(#leafGrad)" />
    <!-- Lemon Body -->
    <ellipse cx="26" cy="28" rx="20" ry="15" transform="rotate(-25 26 28)" fill="url(#lemonGrad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))" />
    <!-- Small tip -->
    <path d="M8 20 C6 22, 5 25, 7 27 C8 26, 9 24, 11 23 Z" fill="#F4CE14" />
    <path d="M44 32 C46 34, 47 37, 45 39 C44 38, 43 36, 41 35 Z" fill="#F4CE14" />
  </g>

  <!-- Typography -->
  <text x="65" y="34" font-family="'Markazi Text', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#495E57" letter-spacing="1.5">LITTLE LEMON</text>
  <text x="66" y="49" font-family="'Karla', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#EE9972" letter-spacing="4">MEDITERRANEAN RESTAURANT</text>
</svg>
